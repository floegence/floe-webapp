    <rect x="164" y="248" width="62" height="4" rx="2" fill="#60a5fa"/>
    <rect x="234" y="248" width="62" height="4" rx="2" fill="#55d98a"/>
    <rect x="304" y="248" width="62" height="4" rx="2" fill="#64748b"/>
