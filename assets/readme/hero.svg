    <rect x="0" y="42" width="38" height="232" fill="#0e1522"/>
    <path d="M38 42V274M148 42V274" stroke="#273244"/>
    <rect x="50" y="58" width="86" height="8" rx="4" fill="#334155"/>
    <rect x="50" y="78" width="64" height="8" rx="4" fill="#243148"/>
    <rect x="50" y="98" width="78" height="8" rx="4" fill="#243148"/>

    <g transform="translate(164 58)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <g>
        <rect width="112" height="82" rx="6" fill="#0b1019" stroke="#3b4a61"/>
        <path d="M0 24H112" stroke="#273244"/>
        <circle cx="10" cy="12" r="3" fill="#fb7185"/>
        <circle cx="20" cy="12" r="3" fill="#fbbf24"/>
        <text x="10" y="48" fill="#55d98a">$ pnpm</text>
        <text x="10" y="69" fill="#64748b">Terminal</text>
      </g>
      <g transform="translate(124 0)">
        <rect width="112" height="82" rx="6" fill="#0b1019" stroke="#3b4a61"/>
        <path d="M0 24H112" stroke="#273244"/>
        <path d="M12 42H78M12 56H94M12 70H62" stroke="#60a5fa" stroke-width="4"/>
