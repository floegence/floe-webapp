  <g id="metadata" transform="translate(56 362)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <circle cx="5" cy="-6" r="5" fill="#55d98a"/>
    <text x="20" y="0" fill="#cbd5e1">CORE SHELL</text>
    <circle cx="162" cy="-6" r="5" fill="#60a5fa"/>
    <text x="177" y="0" fill="#cbd5e1">DECK + WORKBENCH</text>
    <circle cx="394" cy="-6" r="5" fill="#fbbf24"/>
    <text x="409" y="0" fill="#cbd5e1">OPTIONAL RPC</text>
    <text x="700" y="0" fill="#64748b">ACTIVITY / DECK / WORKBENCH</text>
