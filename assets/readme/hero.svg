<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">Floe Webapp</title>
  <desc id="desc">A Solid.js framework for composing application shells, deck layouts, workbench canvases, and optional typed remote capabilities.</desc>

  <rect width="1200" height="400" rx="8" fill="#0b0f17"/>
  <path d="M0 334H1200" stroke="#20293a"/>
  <path d="M660 0V400" stroke="#20293a"/>

  <g id="identity">
    <g transform="translate(82 66)">
      <g transform="scale(0.65 0.85)">
        <path fill="#f8fafc" d="M8 32V14C8 8 10 6 16 6H26C29 6 30 9 29 11.5C28.2 13.5 26.5 14 25 14H18C16 14 15 15 15 17C15 19 16 20 18 20H24C26.5 20 28 22 27.5 24.5C27 27 25 28 23 28H18C17 28 16 29 16 32H8Z" transform="translate(-32 -19)"/>
        <path fill="#f8fafc" d="M8 32V14C8 8 10 6 16 6H26C29 6 30 9 29 11.5C28.2 13.5 26.5 14 25 14H18C16 14 15 15 15 17C15 19 16 20 18 20H24C26.5 20 28 22 27.5 24.5C27 27 25 28 23 28H18C17 28 16 29 16 32H8Z" transform="scale(-1 1) translate(-32 -19)"/>
      </g>
    </g>

    <text x="112" y="74" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">SOLID.JS WORKSPACE FRAMEWORK</text>
    <text x="56" y="164" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="72" font-weight="720">Floe Webapp</text>
    <text x="58" y="218" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="500">Compose the shell. Own the product.</text>
    <text x="58" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">Reusable navigation, workspace surfaces, commands,</text>
    <text x="58" y="289" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">themes, and typed protocol wiring for serious web apps.</text>
  </g>

  <g id="workspace-proof" transform="translate(700 42)">
    <rect width="444" height="274" rx="8" fill="#111827" stroke="#334155"/>
    <rect width="444" height="42" rx="8" fill="#151d2b"/>
    <path d="M0 42H444" stroke="#334155"/>

    <circle cx="18" cy="21" r="5" fill="#fb7185"/>
    <circle cx="34" cy="21" r="5" fill="#fbbf24"/>
    <circle cx="50" cy="21" r="5" fill="#55d98a"/>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="600">
      <text x="92" y="27" fill="#64748b">Activity</text>
      <text x="190" y="27" fill="#64748b">Deck</text>
      <rect x="250" y="8" width="126" height="26" rx="6" fill="#243148" stroke="#60a5fa"/>
      <text x="266" y="27" fill="#f8fafc">Workbench</text>
