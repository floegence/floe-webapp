        <path d="M0 24H112" stroke="#273244"/>
        <path d="M12 65L32 48L51 57L72 37L99 46" fill="none" stroke="#55d98a" stroke-width="4"/>
        <text x="48" y="18" fill="#64748b">Monitor</text>
